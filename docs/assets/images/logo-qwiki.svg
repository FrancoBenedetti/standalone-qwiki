<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 48" width="126" height="42">
  <defs>
    <linearGradient id="q-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="48%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="q-tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Common white pill container for crisp contrast in both Dark & Light modes -->
  <rect x="1.5" y="1.5" width="141" height="45" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Left: Qwiki Q Emblem -->
  <g transform="translate(8, 1)">
    <!-- Outer Orbit Ring of the 'Q' -->
    <circle cx="21" cy="22.5" r="13.2" fill="none" stroke="url(#q-ring)" stroke-width="4.1"/>

    <!-- Compact Typographic Q Tail -->
    <line x1="28" y1="29.5" x2="34.8" y2="36.3" stroke="url(#q-tail)" stroke-width="4.2" stroke-linecap="round"/>

    <!-- Open Wiki Pages inside the Q -->
    <path d="M20.2 28.1 C17.1 26.9 13.6 27.2 10.6 28.4 L10.6 17.4 C13.6 16.2 17.1 16.5 20.2 17.7 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="1.15" stroke-linejoin="round"/>
    <path d="M21.8 28.1 C24.9 26.9 28.4 27.2 31.4 28.4 L31.4 17.4 C28.4 16.2 24.9 16.5 21.8 17.7 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.15" stroke-linejoin="round"/>
    <path d="M21 17.1 L21 28.6" stroke="#475569" stroke-width="1.35" stroke-linecap="round"/>

    <!-- Page text lines -->
    <line x1="13" y1="20.4" x2="18.3" y2="19.8" stroke="#64748B" stroke-width="1.35" stroke-linecap="round"/>
    <line x1="13" y1="23.9" x2="17.3" y2="23.3" stroke="#64748B" stroke-width="1.35" stroke-linecap="round"/>
    <line x1="23.7" y1="19.8" x2="29" y2="20.4" stroke="#0284C7" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="23.7" y1="23.3" x2="28" y2="23.9" stroke="#64748B" stroke-width="1.35" stroke-linecap="round"/>

    <!-- Subtle Sparkle -->
    <path d="M21 11.7 L21.6 13.4 L23.3 14 L21.6 14.6 L21 16.3 L20.4 14.6 L18.7 14 L20.4 13.4 Z" fill="#0284C7"/>
  </g>

  <!-- Right: Clean Qwiki Wordmark -->
  <text x="53" y="32.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.6">
    <tspan fill="#0F172A">Q</tspan><tspan fill="#4F46E5">wiki</tspan>
  </text>
</svg>
