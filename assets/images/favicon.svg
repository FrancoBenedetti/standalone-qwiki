<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="q-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="48%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="q-tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Universal high-contrast tile for both dark & light browser tabs -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Outer Q Orbit Ring -->
  <circle cx="30.5" cy="30" r="18" fill="none" stroke="url(#q-ring)" stroke-width="5.5"/>

  <!-- Compact Typographic Q Tail -->
  <line x1="39.5" y1="39" x2="48.5" y2="48" stroke="url(#q-tail)" stroke-width="5.6" stroke-linecap="round"/>

  <!-- Open Wiki Pages inside the Q -->
  <path d="M29.5 37.2 C25.4 35.7 20.8 36 16.8 37.7 L16.8 23.2 C20.8 21.5 25.4 21.8 29.5 23.3 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M31.5 37.2 C35.6 35.7 40.2 36 44.2 37.7 L44.2 23.2 C40.2 21.5 35.6 21.8 31.5 23.3 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M30.5 22.7 L30.5 37.8" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Crisp Page Lines -->
  <line x1="19.8" y1="27.2" x2="27" y2="26.4" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="19.8" y1="31.6" x2="26" y2="30.9" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="26.4" x2="41.2" y2="27.2" stroke="#0284C7" stroke-width="1.9" stroke-linecap="round"/>
  <line x1="34" y1="30.9" x2="40.2" y2="31.6" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
</svg>
